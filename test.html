<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Core Beliefs — Creative</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Chronicle Display", serif;
    }

    /* ================= MENU ================= */
    .menu-top,
    .submenu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu-top>li {
      position: relative;
    }

    .menu-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      border-radius: 8px;
    }

    .menu-text {
      text-decoration: none;
      color: #000;
      font-size: 16px;
    }

    .arrow {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.3s ease;
    }

    .has-submenu.open>.menu-link .arrow {
      transform: rotate(90deg);
    }

    .submenu {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      padding-left: 16px;
    }

    .has-submenu.open>.submenu {
      max-height: 500px;
      opacity: 1;
    }

    .submenu a {
      display: block;
      padding: 8px 16px;
      text-decoration: none;
      color: #000;
    }

    .submenu a:hover {
      background: rgba(171, 144, 76, 0.15);
      color: #ab904c;
    }
  </style>
</head>

<body>

  <!-- MENU -->
  <div class="side-menu">

    <ul class="menu-top">
      <li><a href="index.html" class="menu-link menu-text">Home</a></li>
      <li><a href="Aboutus.html" class="menu-link menu-text">About Us</a></li>
      <li><a href="PRE.html" class="menu-link menu-text">Press Release & Events</a></li>

      <!-- PROJECTS -->
      <li class="has-submenu">
        <div class="menu-link">
          <a href="project.html" class="menu-text">Projects</a>
          <button class="arrow">→</button>
        </div>

        <ul class="submenu">

          <!-- ONGOING -->
          <li class="has-submenu">
            <div class="menu-link">
              <span class="menu-text">Ongoing</span>
              <button class="arrow">→</button>
            </div>

            <ul class="submenu">
              <li><a href="ivana.html">Ivana</a></li>
              <li><a href="highnine.html">Highnine</a></li>
            </ul>
          </li>

          <!-- UPCOMING -->
          <li class="has-submenu">
            <div class="menu-link">
              <span class="menu-text">Upcoming</span>
              <button class="arrow">→</button>
            </div>

            <ul class="submenu">
              <li><a href="India.html">India</a></li>
            </ul>
          </li>

          <!-- COMPLETED -->
          <li>
            <a href="Dubai.html" class="menu-link menu-text">Completed</a>
          </li>

        </ul>
      </li>

      <li><a href="CSR.html" class="menu-link menu-text">CSR</a></li>
    </ul>

  </div>

  <!-- JS -->
  <script>
    document.querySelectorAll(".has-submenu .arrow").forEach(btn => {
      btn.addEventListener("click", e => {
        e.preventDefault();
        e.stopPropagation();
        btn.closest(".has-submenu").classList.toggle("open");
      });
    });
  </script>

</body>

</html>
